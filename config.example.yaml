universe: []                 # filled by backfill.py --seed
sector_map: {}               # ticker -> group; seeded manually/by script later
groups:
  bank:      {primary: pbv,      secondary: per}
  financial: {primary: pbv,      secondary: per}
  consumer:  {primary: per,      secondary: pbv}
  general:   {primary: per,      secondary: pbv}
  commodity: {primary: ev_ebitda, secondary: ps}
  property:  {primary: pbv,      secondary: per}
windows_days: {w3y: 756, w5y: 1260}
min_coverage: 0.8
filing_lag_days: 90
winsor_pct: [0.01, 0.99]
thresholds: {watch: -1.0, deep: -2.0}
ca_overrides: []             # [{code: BBRI, date: "2024-06-10", mult: 0.83}]
yahoo_years: 6
valuation:
  # Graham number Y parameter: current IDR AAA corporate bond yield.
  # Used as the default for the /api/valuation/{code} endpoint when
  # the caller does not pass ?bond_yield=. Update quarterly.
  # Range constraint: (0, 0.5).
  bond_yield_default: 0.065
# Peer groups for sector-relative comparison. Each ticker in a group
# gets a `peer` field on the /api/ticker and /api/screen responses
# (median / p25 / p75 / pctile / high_base_warning). Tickers not in any
# group are unaffected. Keep groups small (3-8 tickers) so the median
# is meaningful.
peer_groups:
  retail:    # Alfamart, Ace Hardware, Mitra Adiperkasa
    - AMRT
    - ACES
    - MAPI
  food:      # Consumer staples / branded food
    - INDF
    - ICBP
    - UNVR
    - MYOR
    - SIDO
  telco:
    - TLKM
    - ISAT
    - EXCL
  tobacco:
    - GGRM
    - HMSP
  # extend as needed; tickers not in any group get peer=null in the API

# Industry lens: per-sector valuation interpretation. Each sector defines
# its primary metric (z-scored via existing stats), supporting threshold
# checks (current value vs threshold, no z-score), and verdict rules
# (priority-ordered list of AND-joined conditions).
#
# Tickers whose sector is NOT in this map get industry_lens=null in the
# API (opt-in, same pattern as peer_groups). Sectors not listed fall
# through to the "general" lens.
#
# Threshold keys are named metric_min / metric_max (direction encoded).
# Verdict rule priority: undervalued_quality > cheap_but_deteriorating >
# expensive > fair (first match wins). Missing supporting metrics skip
# the rule silently (no crash).
#
# NOTE: condition values are quoted strings (e.g. "<= -1.0"). Unquoted
# YAML scalars starting with "<" or ">" are interpreted as block-scalar
# indicators and will not parse; quotes keep the string literal intact.
industry_lenses:
  bank:
    label: bank_value
    primary: pbv
    supporting:
      roe_min: 0.15
      der_max: 5.0
    verdict_rules:
      undervalued_quality:
        - primary_z: "<= -1.0"
        - roe:      ">= 0.15"
        - der:      "<= 5.0"
      cheap_but_deteriorating:
        - primary_z: "<= -1.0"
        - roe:      "< 0.15"
      expensive:
        - primary_z: ">= 1.5"
      fair: default

  commodity:
    label: commodity_value
    primary: ev_ebitda
    supporting:
      roe_min: 0.10
    verdict_rules:
      undervalued_quality:
        - primary_z: "<= -1.0"
        - roe:      ">= 0.10"
      expensive:
        - primary_z: ">= 1.5"
      fair: default

  consumer:
    label: consumer_value
    primary: per
    supporting:
      roe_min: 0.15
      pbv_max: 5.0
    verdict_rules:
      undervalued_quality:
        - primary_z: "<= -1.5"
        - roe:      ">= 0.15"
      expensive:
        - primary_z: ">= 1.5"
      fair: default

  property:
    label: property_value
    primary: pbv
    supporting:
      der_max: 2.0
    verdict_rules:
      undervalued_quality:
        - primary_z: "<= -1.0"
        - der:      "<= 2.0"
      expensive:
        - primary_z: ">= 1.5"
      fair: default

  general:
    label: general_value
    primary: per
    supporting:
      roe_min: 0.10
    verdict_rules:
      undervalued_quality:
        - primary_z: "<= -1.5"
        - roe:      ">= 0.10"
      expensive:
        - primary_z: ">= 1.5"
      fair: default
  # extend as needed; sectors not listed here get industry_lens=null
